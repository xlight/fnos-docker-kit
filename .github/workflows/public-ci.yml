# 公开 CI 构建单元：**只管显式触发的镜像构建**（不检测、不自动触发）
# 设计来源：streamline-public-release-flow D1（观察/构建/发布三单元）、D10（失败按阶段分类）
#
# 触发：**只有显式声明**（workflow_dispatch，或 publish.sh --image <ver> 的 dispatch）。
#   - 定时检测在另一个 workflow（public-watch.yml）里，只提示不构建。
#   - 本 workflow 的失败不产生"每天一条"的重复 issue：同一（版本, 类型）复用同一条。
#
# 失败分类（issue 标题按阶段措辞，不再一律叫 "patchset miss"）：
#   缺补丁集 → 待 rebase（由 watch-issue.py 维护，与观察单元同一条）
#   补丁检查 → 补丁失配（需重锚）
#   补丁施加 → 补丁施加失败
#   镜像生成 → 镜像生成失败
#   推送     → 推送失败
#   依赖/磁盘/下载 → 基础设施受阻
name: public-ci

on:
  workflow_dispatch:
    inputs:
      version:
        description: "fnOS 版本（如 1.2.1000；留空 = 用检测器当前版本）"
        required: false
        default: ""
      channel:
        description: "构建通道：iso（官方 ISO）或 deb（OTA .deb 覆盖）"
        required: false
        default: "iso"
      iso_url:
        description: "官方 ISO 签名直链（留空则现取；仅 iso 通道用）"
        required: false
        default: ""
      base_tag:
        description: "deb 通道底座镜像 tag（留空则自动挑 Hub 上更低的最高 tag）"
        required: false
        default: ""
      promote_latest:
        description: "同时推进 latest（仅 iso 通道；默认不动）"
        required: false
        default: false
        type: boolean

env:
  DOCKERHUB_REPO: "xlight/fnos-dockermode"

jobs:
  build:
    runs-on: ubuntu-22.04
    permissions:
      contents: write   # 上传出厂指纹资产到该版本的 Release
    outputs:
      version: ${{ steps.plan.outputs.version }}
      channel: ${{ steps.plan.outputs.channel }}
      tag: ${{ steps.plan.outputs.tag }}
      patchset: ${{ steps.gate.outputs.patchset }}
      ready: ${{ steps.check.outputs.ready }}
      total: ${{ steps.check.outputs.total }}
      patchset_sha256: ${{ steps.check.outputs.patchset_sha256 }}
      failed_stage: ${{ steps.classify.outputs.stage }}
    steps:
      - uses: actions/checkout@v4

      - name: 断言构建依赖集合齐全（构建工具自报，缺一即停）
        id: deps
        run: |
          set -o pipefail
          python3 toolchain/fnos_patch.py --required-files > /tmp/req-files.txt 2>&1 | tee /tmp/stage-deps.log
          missing=0
          while IFS= read -r f; do
            [ -n "$f" ] || continue
            case "$f" in toolchain/patches/*) continue;; esac
            if [ ! -e "$f" ]; then echo "缺构建依赖: $f"; missing=1; fi
          done < /tmp/req-files.txt
          [ "$missing" = 0 ] || { echo "公开树缺构建依赖，中止"; exit 1; }
          echo "构建依赖集合齐全"

      - name: 安装构建依赖（对齐 toolchain/deps.sh 最小集）
        id: install
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq genisoimage e2fsprogs zip unzip
          for t in isoinfo mkfs.ext4 e2fsck unzip zip dpkg-deb; do
            command -v "$t" >/dev/null || { echo "缺工具: $t"; exit 1; }
          done

      - name: 磁盘断言（ISO 头物料峰值约 20G；deb 头约底座 4G + 包组 1G + 解包）
        id: disk
        run: |
          avail=$(df --output=avail -BG "$RUNNER_TEMP" | tail -1 | tr -dc 0-9)
          echo "可用磁盘: ${avail}G"
          [ "$avail" -ge 25 ] || { echo "磁盘不足，中止"; exit 1; }

      - name: 确定构建目标（版本/通道/tag）
        id: plan
        run: |
          set -o pipefail
          channel="${{ inputs.channel }}"
          [ "$channel" = "deb" ] || channel="iso"
          version="${{ inputs.version }}"
          if [ -z "$version" ]; then
            out=$(python3 toolchain/check-iso-update.py --signed --no-ota 2>/dev/null) || {
              echo "检测器失败，无法确定版本（请显式传 version）"; exit 1; }
            version=$(echo "$out" | python3 -c 'import sys,json; print(json.load(sys.stdin)["current"]["version"])')
            if [ -z "${{ inputs.iso_url }}" ]; then
              url=$(echo "$out" | python3 -c 'import sys,json; d=json.load(sys.stdin); print(d.get("signed_url") or "")')
              echo "ISO_URL=$url" >> "$GITHUB_ENV"
            fi
          fi
          if [ "$channel" = "iso" ]; then tag="$version"; else tag="$version-ota"; fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "channel=${channel}" >> "$GITHUB_OUTPUT"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "VERSION=${version}" >> "$GITHUB_ENV"
          echo "CHANNEL=${channel}" >> "$GITHUB_ENV"
          echo "TAG=${tag}" >> "$GITHUB_ENV"
          echo "PLAN: version=$version channel=$channel tag=$tag"

      - name: Hub 去重（幂等）：tag 已存在则跳过；查询失败保守跳过并告警
        id: dedup
        run: |
          # 保守语义：Hub 查询失败**不得**当作"tag 不存在"（那会重复构建并覆盖 latest）
          code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 30 \
            "https://hub.docker.com/v2/repositories/${DOCKERHUB_REPO}/tags/$TAG")
          if [ "$code" = "200" ]; then
            echo "already=yes" >> "$GITHUB_OUTPUT"
            echo "Hub 上已有 $TAG → 跳过构建（幂等）"
          elif [ "$code" = "404" ]; then
            echo "already=no" >> "$GITHUB_OUTPUT"
            echo "Hub 上无 $TAG → 继续构建"
          else
            echo "already=unknown" >> "$GITHUB_OUTPUT"
            echo "::warning::Docker Hub 查询失败（http=$code）→ 保守跳过构建"
            exit 1
          fi

      - name: 补丁集门禁（缺失=需人工 rebase，本 step 只标记不失败）
        id: gate
        run: |
          ps="toolchain/patches/fnos-${VERSION#V}.json"
          if [ -f "$ps" ]; then
            echo "patchset=ok" >> "$GITHUB_OUTPUT"
            echo "PATCHSET=$ps" >> "$GITHUB_ENV"
          else
            echo "patchset=missing" >> "$GITHUB_OUTPUT"
            echo "无该版本补丁集（${VERSION}），需人工 rebase"
          fi

      - name: 无补丁集显式失败（待 rebase issue 由观察单元/watch-issue.py 维护）
        id: gate-fail
        if: steps.dedup.outputs.already == 'no' && steps.gate.outputs.patchset == 'missing'
        run: |
          echo "patchset for $VERSION missing, needs manual rebase"
          exit 1

      # ---- iso 通道：现签下载 + hash 校验 + extract ----
      - name: 恢复 ISO 缓存（按版本 key；命中则跳过下载）
        id: iso-cache
        if: env.CHANNEL == 'iso' && inputs.version != ''
        uses: actions/cache/restore@v4
        with:
          path: /tmp/fnos.iso
          key: fnos-iso-${{ steps.plan.outputs.version }}
          restore-keys: fnos-iso-

      - name: 下载官方 ISO（含官网 hash 校验，坏缓存当场重下）
        id: iso-download
        if: env.CHANNEL == 'iso' && steps.dedup.outputs.already == 'no'
        run: |
          set -o pipefail
          url="${{ inputs.iso_url }}"
          [ -n "$url" ] || url="${ISO_URL:-}"
          [ -n "$url" ] || { echo "无 ISO 下载地址（请传 iso_url 或留空 version 让检测器现取签名 URL）"; exit 1; }
          if [ "${{ steps.iso-cache.outputs.cache-hit }}" != "true" ]; then
            curl -fL --retry 3 -o /tmp/fnos.iso.downloading "$url" 2>&1 | tee /tmp/stage-download.log
            mv /tmp/fnos.iso.downloading /tmp/fnos.iso
          else
            echo "命中 ISO 缓存，跳过下载"
          fi
          ls -la /tmp/fnos.iso
          want=$(python3 toolchain/check-iso-update.py --signed --no-ota 2>/dev/null \
                 | python3 -c 'import sys,json; print(json.load(sys.stdin)["current"]["hash"])' 2>/dev/null || echo "")
          if [ -n "$want" ] && [ "$VERSION" = "$(python3 toolchain/check-iso-update.py --signed --no-ota 2>/dev/null | python3 -c 'import sys,json; print(json.load(sys.stdin)["current"]["version"])' 2>/dev/null || echo x)" ]; then
            got=$(md5sum /tmp/fnos.iso | awk '{print $1}')
            if [ "$got" != "$want" ]; then
              echo "ISO hash 不符（坏缓存？）：want=$want got=$got，重下一次"
              rm -f /tmp/fnos.iso
              curl -fL --retry 3 -o /tmp/fnos.iso.downloading "$url" 2>&1 | tee -a /tmp/stage-download.log
              mv /tmp/fnos.iso.downloading /tmp/fnos.iso
              got=$(md5sum /tmp/fnos.iso | awk '{print $1}')
              [ "$got" = "$want" ] || { echo "重下仍不一致，中止"; exit 1; }
            fi
            echo "ISO hash 一致"
          else
            echo "无官方 hash 可比（版本与当前不一致或检测失败），跳过 hash 校验"
          fi

      - name: 即刻存 ISO 缓存（不等 job 结束；后段失败也不白下）
        if: env.CHANNEL == 'iso' && steps.iso-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: /tmp/fnos.iso
          key: fnos-iso-${{ steps.plan.outputs.version }}

      - name: ISO 头 extract 出厂 rootfs
        id: extract
        if: env.CHANNEL == 'iso' && steps.dedup.outputs.already == 'no'
        run: |
          set -o pipefail
          sudo python3 toolchain/fnos_iso.py extract /tmp/fnos.iso "$RUNNER_TEMP/factory" 2>&1 | tee /tmp/stage-extract.log
          rm -f /tmp/fnos.iso

      # ---- deb 通道：底座 export + 清理 + .deb 覆盖 + 版本戳 ----
      - name: deb 头物化 rootfs（底座 export + 清理 + .deb 覆盖 + 版本戳）
        id: deb-materialize
        if: env.CHANNEL == 'deb' && steps.dedup.outputs.already == 'no'
        run: |
          set -o pipefail
          base="${{ inputs.base_tag }}"
          if [ -z "$base" ]; then
            # 保守语义：Hub 查询失败 ≠ "没有底座"（那会导致重复构建/错误推进 latest）
            hub_json=$(curl -fsS --max-time 30 "https://hub.docker.com/v2/repositories/${DOCKERHUB_REPO}/tags?page_size=100") \
              || { echo "Docker Hub 查询失败（保守跳过构建，不当作无底座）"; exit 1; }
            base=$(echo "$hub_json" | python3 -c '
          import json, re, sys, os
          tgt = tuple(int(x) for x in re.findall(r"\d+", os.environ["VERSION"]))
          names = [t["name"] for t in json.load(sys.stdin).get("results", [])]
          best, bestk = "", None
          for n in names:
              v = tuple(int(x) for x in re.findall(r"\d+", n))
              if not v or not (v < tgt):
                  continue
              k = (v, 0 if not n.endswith("-ota") else 1)
              if bestk is None or k > bestk:
                  best, bestk = n, k
          print(best)')
          fi
          [ -n "$base" ] || { echo "无可用底座（Hub 上无低于 $VERSION 的 tag），等 ISO 版先出"; exit 1; }
          echo "底座: $base"
          cid=$(docker create "${DOCKERHUB_REPO}:$base")
          sudo mkdir -p "$RUNNER_TEMP/factory"
          docker export "$cid" | sudo tar -x -C "$RUNNER_TEMP/factory"
          docker rm "$cid"
          # 运行时清理：身份与日志残留去干净，machine-id 由推送步重建
          sudo rm -f "$RUNNER_TEMP/factory/etc/machine-id" \
            "$RUNNER_TEMP/factory/etc/hostname" "$RUNNER_TEMP/factory/.dockerenv"
          sudo rm -rf "$RUNNER_TEMP/factory/var/log/"* "$RUNNER_TEMP/factory/tmp/"* \
            "$RUNNER_TEMP/factory/run/"*
          [ -e "$RUNNER_TEMP/factory/etc/machine-id" ] && { echo "清理漏项：machine-id 仍在"; exit 1; }
          [ -e "$RUNNER_TEMP/factory/.dockerenv" ] && { echo "清理漏项：/.dockerenv 仍在"; exit 1; }
          # .deb 包组现签现下（sha256==manifest sign 逐包校验，失败即停）
          python3 toolchain/fetch-ota-debs.py --version "$VERSION" --out /tmp/debs
          # B 文件覆盖法：只解 data 内容覆盖，不跑 dpkg 库与 pre/post
          # --keep-directory-symlink 必备（不是 -k：-k 含 --keep-old-files 会拒绝覆盖
          # 已有文件）：底座是 usrmerge 布局（lib->usr/lib），.deb 内是 ./lib/ 真实
          # 目录项；无此旗标 tar 会把链接替换成实目录，1950+ 库被影子目录遮蔽，
          # /sbin/init 与 /lib/systemd/systemd 全 dangling。
          for d in /tmp/debs/*.deb; do
            echo "overlay: $(basename "$d")"
            dpkg-deb --fsys-tarfile "$d" | sudo tar -x --keep-directory-symlink -C "$RUNNER_TEMP/factory"
          done
          rm -rf /tmp/debs
          # 手工版本戳（.deb 不含它；fnos_patch 版本锚点必需）
          echo "$VERSION" | sudo tee "$RUNNER_TEMP/factory/usr/trim/etc/version" >/dev/null
          [ "$(sudo cat "$RUNNER_TEMP/factory/usr/trim/etc/version")" = "$VERSION" ] \
            || { echo "版本戳写入失败"; exit 1; }

      # ---- FAN-IN：以下尾巴两通道一字不差 ----

      - name: aobpatch check（失败即停，不写半成品）
        id: check
        if: steps.gate.outputs.patchset == 'ok' && steps.dedup.outputs.already == 'no'
        run: |
          set -o pipefail
          sudo python3 toolchain/aobpatch.py check \
            --rootfs "$RUNNER_TEMP/factory" \
            --patchset "$PATCHSET" \
            --report "$RUNNER_TEMP/patch-report.json" 2>&1 | tee /tmp/stage-check.log
          cat "$RUNNER_TEMP/patch-report.json"
          # 输出 ready/total/sha256
          python3 -c "
          import json, os
          d = json.load(open(os.environ['RUNNER_TEMP'] + '/patch-report.json'))
          ps = d.get('patches', [])
          ok = ('ready', 'already')
          ready = sum(1 for p in ps if str(p.get('status', '')).split('(')[0] in ok)
          print('ready=%d' % ready)
          print('total=%d' % len(ps))
          print('patchset_sha256=%s' % (d.get('patchset_sha256') or ''))
          " >> "$GITHUB_OUTPUT"

      - name: 提取出厂指纹并提升为永久公开资产（tier-A / factory）
        id: fingerprints
        if: steps.gate.outputs.patchset == 'ok' && steps.check.outcome == 'success'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -o pipefail
          python3 .github/scripts/fingerprints.py extract \
            --report "$RUNNER_TEMP/patch-report.json" \
            --version "$VERSION" \
            --out "/tmp/fingerprints-${VERSION}.json"
          # 永久化：挂到该版本的 Release（若已存在）；否则随 workflow artifact 留存
          if gh release view "v${VERSION}" >/dev/null 2>&1; then
            gh release upload "v${VERSION}" "/tmp/fingerprints-${VERSION}.json" --clobber
            echo "permanent=yes" >> "$GITHUB_OUTPUT"
            echo "指纹资产已挂到 Release v${VERSION}"
          else
            echo "permanent=no" >> "$GITHUB_OUTPUT"
            echo "Release v${VERSION} 尚未创建；指纹随 workflow artifact 留存（发布时再挂）"
          fi

      - name: patch apply（打补丁）
        id: apply
        if: steps.gate.outputs.patchset == 'ok' && steps.check.outcome == 'success'
        run: |
          set -o pipefail
          sudo python3 toolchain/fnos_patch.py apply --rootfs "$RUNNER_TEMP/factory" \
            --patches "$PATCHSET" 2>&1 | tee /tmp/stage-apply.log

      - name: 镜像生成与自检（mkraw + fsck）
        id: image
        if: steps.gate.outputs.patchset == 'ok' && steps.apply.outcome == 'success'
        run: |
          set -o pipefail
          sudo python3 toolchain/fnos_image.py mkraw "$RUNNER_TEMP/factory" "$RUNNER_TEMP/image.raw" 12 --fs=ext4 2>&1 | tee /tmp/stage-image.log
          sudo python3 toolchain/fnos_image.py check "$RUNNER_TEMP/image.raw" \
            --patchset="$PATCHSET" 2>&1 | tee -a /tmp/stage-image.log

      - name: 校验 nfs-server mask 在位（宿主内核态防护，单元名与 fnos_patch.py MASK_UNITS 保持一致）
        id: mask
        if: steps.gate.outputs.patchset == 'ok' && steps.image.outcome == 'success'
        run: |
          set -o pipefail
          link="$RUNNER_TEMP/factory/etc/systemd/system/nfs-server.service"
          [ -L "$link" ] || { echo "mask 缺失：$link 不是符号链接"; exit 1; }
          [ "$(readlink "$link")" = "/dev/null" ] || { echo "mask 目标错误：$(readlink "$link")"; exit 1; }
          echo "nfs-server 已 mask"

      - name: "docker import + 参数化推送（iso: tag[+latest]；deb: X-ota 永不 latest）"
        id: push
        if: steps.gate.outputs.patchset == 'ok' && steps.image.outcome == 'success' && steps.mask.outcome == 'success'
        run: |
          set -o pipefail
          echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login -u "${{ secrets.DOCKERHUB_USER }}" --password-stdin
          ver="$VERSION"; tag="$TAG"
          ps_sha=$(sha256sum "$PATCHSET" | awk '{print $1}')
          # 容器运行必需（fnos_patch 不管这两项）：有效 machine-id + /run 骨架
          [ -s "$RUNNER_TEMP/factory/etc/machine-id" ] || \
            python3 -c "import uuid; print(uuid.uuid4().hex)" | sudo tee "$RUNNER_TEMP/factory/etc/machine-id" >/dev/null
          sudo mkdir -p "$RUNNER_TEMP/factory/run/systemd/system"
          # 镜像携带可机读的补丁集标注（版本 + sha256），消费者可确认"带的是哪个补丁集"
          sudo tar -C "$RUNNER_TEMP/factory" -c --exclude=proc --exclude=sys --exclude=dev . | docker import \
            --change 'ENTRYPOINT ["/lib/systemd/systemd"]' \
            --change 'ENV container=docker' \
            --change 'CMD ["log-level=info"]' \
            --change "LABEL fnos.patchset.version=${ver}" \
            --change "LABEL fnos.patchset.sha256=${ps_sha}" \
            - "${DOCKERHUB_REPO}:$tag"
          docker push "${DOCKERHUB_REPO}:$tag"
          if [ "${{ inputs.promote_latest }}" = "true" ] && [ "$CHANNEL" = "iso" ]; then
            docker tag "${DOCKERHUB_REPO}:$tag" "${DOCKERHUB_REPO}:latest"
            docker push "${DOCKERHUB_REPO}:latest"
          else
            echo "不推进 latest（仅 iso 通道 + 显式 promote_latest 才推进）"
          fi

      - name: 失败归类（供 open-issue 使用：阶段 + 日志尾部）
        id: classify
        if: always()
        run: |
          stage=""
          if [ "${{ steps.gate.outputs.patchset }}" = "missing" ]; then
            stage="缺补丁集"
          elif [ "${{ steps.deps.outcome }}" = "failure" ]; then
            stage="构建依赖缺失"
          elif [ "${{ steps.install.outcome }}" = "failure" ]; then
            stage="构建环境"
          elif [ "${{ steps.disk.outcome }}" = "failure" ]; then
            stage="磁盘不足"
          elif [ "${{ steps.iso-download.outcome }}" = "failure" ]; then
            stage="ISO 下载"
          elif [ "${{ steps.extract.outcome }}" = "failure" ]; then
            stage="ISO 解包"
          elif [ "${{ steps.deb-materialize.outcome }}" = "failure" ]; then
            stage="deb 物化"
          elif [ "${{ steps.check.outcome }}" = "failure" ]; then
            stage="补丁检查"
          elif [ "${{ steps.apply.outcome }}" = "failure" ]; then
            stage="补丁施加"
          elif [ "${{ steps.image.outcome }}" = "failure" ]; then
            stage="镜像生成"
          elif [ "${{ steps.mask.outcome }}" = "failure" ]; then
            stage="镜像校验"
          elif [ "${{ steps.push.outcome }}" = "failure" ]; then
            stage="推送"
          fi
          echo "stage=$stage" >> "$GITHUB_OUTPUT"
          # 日志尾部（各阶段 tee 出来的日志合并），供 issue 正文引用
          cat /tmp/stage-*.log 2>/dev/null | tail -n 60 > /tmp/failure-tail.log || true
          echo "run_url=${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" >> "$GITHUB_OUTPUT"

      - name: 上传可读报告（含失败日志尾部）
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: patch-report-${{ steps.plan.outputs.tag }}
          path: |
            ${{ runner.temp }}/patch-report.json
            /tmp/failure-tail.log
            /tmp/fingerprints-*.json
          if-no-files-found: warn

  open-issue:
    needs: [build]
    if: failure() && needs.build.result == 'failure' && needs.build.outputs.failed_stage != '' && needs.build.outputs.failed_stage != '缺补丁集'
    runs-on: ubuntu-22.04
    permissions:
      issues: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: patch-report-${{ needs.build.outputs.tag }}
          path: /tmp/report

      - name: 按阶段分类开/更新 Issue（同一版本同一类型复用同一条）
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          STAGE: ${{ needs.build.outputs.failed_stage }}
          VERSION: ${{ needs.build.outputs.version }}
          CHANNEL: ${{ needs.build.outputs.channel }}
          TAG: ${{ needs.build.outputs.tag }}
          RUN_URL: ${{ needs.build.outputs.run_url }}
        run: |
          python3 .github/scripts/build-issue.py \
            --repo "${{ github.repository }}" \
            --version "$VERSION" --channel "$CHANNEL" --tag "$TAG" \
            --stage "$STAGE" --run-url "$RUN_URL" \
            --report /tmp/report/patch-report.json \
            --log-tail /tmp/report/failure-tail.log

  blocked-issue:
    needs: [build]
    if: always() && needs.build.outputs.failed_stage == '缺补丁集'
    runs-on: ubuntu-22.04
    permissions:
      issues: write
    steps:
      - uses: actions/checkout@v4

      - name: 缺补丁集：复用观察单元的「待 rebase」Issue（同一标题格式 = 同一条）
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.build.outputs.version }}
          CHANNEL: ${{ needs.build.outputs.channel }}
        run: |
          cat > /tmp/detect.json <<JSON
          {"current": {"version": "$VERSION"}, "ota": null}
          JSON
          python3 .github/scripts/watch-issue.py \
            --detect /tmp/detect.json \
            --index toolchain/patches/index.json \
            --repo "${{ github.repository }}" \
            --hub-repo "xlight/fnos-dockermode"
